    yenten_core:
        image: i_yenten
        build:
            context: yenten
            dockerfile: Dockerfile
        container_name: yenten_core
        volumes:
            - ${DATA_PATH}/yenten:/data
        expose:
            - ${YTN_RPC_PORT}
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        restart: unless-stopped
